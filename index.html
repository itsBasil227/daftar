<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a46c4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png"><title>Daftar Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daftar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Inter:wght@400;700&family=Caveat:wght@500;700&family=Merriweather:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: a library of notebooks, then a full-bleed paper stage with a floating pen tray at the bottom. */
:root{
  --bg:#eceff5; --surface:#ffffff; --surface-2:#f5f7fb; --fg:#172033; --muted:#5f6880;
  --line:#d9dee8; --accent:#2a46c4; --accent-fg:#ffffff; --accent-soft:#e3e8fb; --danger:#bb3529;
  --shadow:0 10px 30px rgba(22,32,64,.14),0 1px 3px rgba(22,32,64,.08);
  --f-ui:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --surface:#171b24; --surface-2:#1e2330; --fg:#e5e8f0; --muted:#939bb0;
  --line:#2a3040; --accent:#8299ff; --accent-fg:#0e1117; --accent-soft:#232c4c; --danger:#ff7a6b;
  --shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#171b24; --surface-2:#1e2330; --fg:#e5e8f0; --muted:#939bb0;
  --line:#2a3040; --accent:#8299ff; --accent-fg:#0e1117; --accent-soft:#232c4c; --danger:#ff7a6b;
  --shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark}
[hidden]{display:none!important}
html{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* ---------- Library ---------- */
#library{flex:1;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.lib-wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.lib-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-inline-end:auto}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:34px;margin:0;letter-spacing:.01em}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;transform:translateY(-4px)}
.brand small{color:var(--muted);font-size:13px}
.iconbtn{width:42px;height:42px;border-radius:12px;display:inline-grid;place-items:center;color:var(--fg)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn[disabled]{opacity:.35;cursor:default}
.textbtn{height:42px;padding:0 14px;border-radius:12px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.textbtn:hover{background:var(--surface-2)}
.primary{background:var(--accent);color:var(--accent-fg);height:44px;padding:0 18px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.primary:hover{filter:brightness(1.07)}
.lib-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:200px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:8px;position:relative;text-align:start}
.card .thumb{aspect-ratio:4/3;max-width:100%;border-radius:14px;border:1px solid var(--line);background:#fff center/cover no-repeat;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:transform .15s}
.card:hover .thumb{transform:translateY(-2px)}
.card .meta{display:flex;align-items:flex-start;gap:6px}
.card .meta div{flex:1;min-width:0}
.card .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .date{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.card .more{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.card .more:hover{background:var(--surface-2)}
.card .open{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.card .open:focus-visible .thumb{outline:2px solid var(--accent);outline-offset:2px}
.newcard .thumb{display:grid;place-items:center;background:var(--surface);border:1.5px dashed var(--line);color:var(--accent)}
.lib-foot{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
.empty{color:var(--muted);padding:30px 0}

/* ---------- Editor ---------- */
#editor{flex:1;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:4px;padding-block:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
.title-in{flex:1;min-width:60px;max-width:380px;height:38px;border:0;background:transparent;color:var(--fg);font:600 16px var(--f-ui);padding:0 8px;border-radius:8px}
.title-in:focus{background:var(--surface-2);outline:none}
.spacer{flex:1}
.zoombtn{min-width:58px;height:36px;border-radius:10px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.zoombtn:hover{background:var(--surface-2)}
#stage{position:relative;flex:1;overflow:hidden;touch-action:none;background:#fff}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#live,#tip{pointer-events:none}
#stage{-webkit-touch-callout:none;-webkit-user-select:none}

.tray{position:absolute;left:0;top:0;visibility:hidden;display:flex;align-items:center;gap:2px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);z-index:6;max-width:calc(100% - 16px);max-height:calc(100% - 16px);overflow:auto;scrollbar-width:none}
.tray.v{flex-direction:column}
.tray.v .sep{width:28px;height:1px;margin:4px 0}
.tray.drag{box-shadow:0 14px 36px rgba(20,30,60,.3);opacity:.97}
.grip{width:28px;height:46px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;flex:none;border-radius:10px}
.grip:hover{background:var(--surface-2)}
.grip svg{width:18px;height:18px}
.tray.v .grip{width:46px;height:28px}
.tray.v .grip svg{transform:rotate(90deg)}
.ur{display:flex;gap:0}
.favs{flex-wrap:nowrap;gap:6px}
.fav{flex:1;min-width:0;height:54px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted)}
.fav.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.fav .fd{border-radius:50%;box-shadow:0 0 0 1px var(--line);display:block}
.fav small{font-size:10.5px;white-space:nowrap}
.fav .plus{font-size:22px;line-height:1}
.tray::-webkit-scrollbar{display:none}
.tool{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;position:relative;color:var(--fg);flex:none}
.tool:hover{background:var(--surface-2)}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool .cdot{position:absolute;bottom:5px;width:14px;height:3px;border-radius:2px}
.tray .sep{width:1px;height:28px;background:var(--line);margin:0 4px;flex:none}

.pop{position:absolute;z-index:7;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;width:min(340px,calc(100% - 24px));max-height:calc(100% - 16px);overflow:auto}
#opts{left:0;top:0}
#menu{top:8px;inset-inline-end:max(10px,env(safe-area-inset-right,0px));max-height:calc(100% - 16px);overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.chip{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);position:relative}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.sw.custom{background:conic-gradient(#e53935,#fdd835,#43a047,#1e88e5,#8e24aa,#e53935)}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--accent)}
.range output{min-width:28px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55}
select.sel{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;padding:0 10px;flex:1;min-width:0}
.menuitem{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px;border-radius:10px;width:100%;text-align:start}
.menuitem:hover{background:var(--surface-2)}
.menuitem.danger{color:var(--danger)}
.menu-sep{height:1px;background:var(--line);margin:2px 0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.switch{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on::after{inset-inline-start:21px}

#sel{position:absolute;border:1.5px dashed var(--accent);border-radius:6px;z-index:4;cursor:move;touch-action:none;background:rgba(42,70,196,.04)}
#selWidth{position:absolute;width:12px;height:30px;right:-8px;top:50%;margin-top:-15px;border-radius:6px;background:var(--surface);border:2px solid var(--accent);cursor:ew-resize;touch-action:none}
#selHandle{position:absolute;width:22px;height:22px;right:-12px;bottom:-12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);cursor:nwse-resize;touch-action:none}
#selBar{position:absolute;z-index:6;display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
#selBar .iconbtn{width:38px;height:38px}
#selColors{position:absolute;z-index:6;display:flex;gap:6px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
#textEd{position:absolute;z-index:5;border:0;outline:none;resize:none;overflow:hidden;background:transparent;box-shadow:0 0 0 1.5px var(--accent);border-radius:4px;padding:0;margin:0;line-height:1.5;-webkit-user-select:text;user-select:text;white-space:pre-wrap;overflow-wrap:break-word}

/* ---------- Modal, toast, context menu ---------- */
#modalBack{position:fixed;inset:0;background:rgba(10,14,24,.42);z-index:20;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);width:min(440px,100%);padding:20px;display:flex;flex-direction:column;gap:16px;max-height:calc(100% - 32px);overflow:auto}
.modal h2{margin:0;font-size:18px;font-family:var(--f-display);font-weight:700}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .ghost{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);font-weight:500}
.modal .dangerbtn{background:var(--danger);color:#fff;height:44px;padding:0 18px;border-radius:12px;font-weight:600}
.field{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:inherit;padding:0 12px;width:100%;-webkit-user-select:text;user-select:text}
.tpls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tpl{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.tpl canvas{width:100%;aspect-ratio:3/4;border-radius:10px;border:1.5px solid var(--line)}
.tpl.on canvas{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tpl.on{color:var(--accent);font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
#ctx{position:fixed;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:180px}
@media (max-width:520px){.tool{width:42px;height:42px}.brand h1{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body><div id="app">
  <section id="library">
    <div class="lib-wrap">
      <header class="lib-head">
        <div class="brand"><h1 data-i18n="appName">دفتر</h1><span class="dot"></span><small id="libCount"></small></div>
        <button class="textbtn" id="langBtn"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span id="langLbl"></span></button>
        <button class="iconbtn" id="themeBtn" data-i18n-title="theme"><svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
        <button class="iconbtn" id="importBtn" data-i18n-title="importBackup"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></button>
      </header>
      <div class="lib-bar">
        <input class="search" id="search" type="search" data-i18n-ph="search" autocomplete="off">
        <button class="primary" id="newBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="newNotebook"></span></button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="lib-foot"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span data-i18n="localNote"></span></div>
    </div>
  </section>

  <section id="editor" hidden>
    <div class="topbar">
      <button class="iconbtn" id="backBtn" data-i18n-title="back"><svg class="i flip" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <input class="title-in" id="titleIn" autocomplete="off" maxlength="80">
      <div class="spacer"></div>
      <div class="ur" dir="ltr">
        <button class="iconbtn" id="undoBtn" data-i18n-title="undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button class="iconbtn" id="redoBtn" data-i18n-title="redo"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      </div>
      <button class="zoombtn" id="zoomBtn" data-i18n-title="fit">100%</button>
      <button class="iconbtn" id="menuBtn" data-i18n-title="more"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
    </div>
    <div id="stage">
      <canvas id="board"></canvas>
      <canvas id="live"></canvas>
      <canvas id="tip"></canvas>
      <div id="sel" hidden><div id="selWidth" hidden></div><div id="selHandle"></div></div>
      <div id="selBar" hidden></div>
      <div id="selColors" hidden></div>
      <textarea id="textEd" hidden dir="auto" spellcheck="false"></textarea>
      <div class="tray" id="tray"></div>
      <div class="pop" id="opts" hidden></div>
      <div class="pop" id="menu" hidden></div>
    </div>
  </section>
</div>
<div id="modalBack" hidden></div>
<div id="ctx" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="filePdf" accept="application/pdf,.pdf" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>

  const th=c.querySelector('.thumb');th.style.backgroundColor=PAPER[m.paper]||'#fff';if(m.thumb)th.style.backgroundImage=`url(${m.thumb})`;
  c.querySelector('.name').textContent=m.name;c.querySelector('.date').textContent=Date.now()-m.updated<60000?t('justNow'):fmt.format(new Date(m.updated));
  c.querySelector('.open').onclick=()=>openBoard(m.id);c.querySelector('.more').onclick=ev=>{ev.stopPropagation();cardMenu(m,ev.currentTarget)};grid.appendChild(c)})}
function cardMenu(m,anchor){const box=$('#ctx');box.innerHTML='';
 box.append(menuItem(ICON.edit,'rename',()=>renameModal(m)),menuItem(ICON.copy,'duplicate',()=>dupNotebook(m)),menuItem('<path d="M12 3v12M7 10l5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>','backup',async()=>{const d=await DB.data(m.id);exportBackup(m,(d&&d.objs)||[])}),menuItem(ICON.trash,'delete',()=>deleteModal(m),'danger'));
 box.hidden=false;const r=anchor.getBoundingClientRect(),bw=box.offsetWidth,bh=box.offsetHeight;box.style.left=clamp(r.left+r.width/2-bw/2,8,innerWidth-bw-8)+'px';box.style.top=(r.bottom+bh+8<innerHeight?r.bottom+4:r.top-bh-4)+'px'}
document.addEventListener('pointerdown',e=>{if(!$('#ctx').hidden&&!$('#ctx').contains(e.target))$('#ctx').hidden=true},true);
$('#search').addEventListener('input',renderLibrary);
$('#newBtn').onclick=newNotebookModal;

function modal(title,body,actions){const back=$('#modalBack');back.innerHTML='';const m=document.createElement('div');m.className='modal';m.setAttribute('role','dialog');
 const h=document.createElement('h2');h.textContent=title;m.appendChild(h);if(body)m.appendChild(body);const a=document.createElement('div');a.className='actions';
 actions.forEach(([label,cls,fn])=>{const b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=async()=>{if(fn&&(await fn())===false)return;back.hidden=true};a.appendChild(b)});m.appendChild(a);back.appendChild(m);back.hidden=false;
 back.onclick=e=>{if(e.target===back)back.hidden=true};setTimeout(()=>{const i=m.querySelector('input');i&&i.focus()},30)}
function drawTplPreview(c,tpl,paper){const x=c.getContext('2d');c.width=90;c.height=120;x.fillStyle=PAPER[paper];x.fillRect(0,0,90,120);const col=paper==='dark'?'rgba(205,215,240,.3)':'rgba(55,80,150,.3)';x.strokeStyle=col;x.fillStyle=col;
 if(tpl==='lines'||tpl==='grid'){x.beginPath();for(let y=12;y<120;y+=12){x.moveTo(0,y+.5);x.lineTo(90,y+.5)}if(tpl==='grid')for(let X=12;X<90;X+=12){x.moveTo(X+.5,0);x.lineTo(X+.5,120)}x.stroke()}
 if(tpl==='dots')for(let X=12;X<90;X+=12)for(let y=12;y<120;y+=12)x.fillRect(X-1,y-1,2,2)}
function newNotebookModal(){let tpl='lines',paper='white';const body=document.createElement('div');body.style.cssText='display:flex;flex-direction:column;gap:14px';
 const name=document.createElement('input');name.className='field';name.value=t('defaultName');name.setAttribute('aria-label',t('nameLbl'));name.id='nbName';
 const tpls=document.createElement('div');tpls.className='tpls';const paperRow=document.createElement('div');
 const draw=()=>{tpls.innerHTML='';[['blank',t('blank')],['lines',t('lines')],['grid',t('grid')],['dots',t('dots')]].forEach(([k,l])=>{const b=document.createElement('button');b.className='tpl'+(k===tpl?' on':'');const c=document.createElement('canvas');drawTplPreview(c,k,paper);b.append(c,document.createTextNode(l));b.onclick=()=>{tpl=k;draw()};tpls.appendChild(b)});
  paperRow.replaceChildren(chips([['white',t('white')],['warm',t('warm')],['dark',t('dark')]],paper,v=>{paper=v;draw()}))};draw();
 name.addEventListener('keydown',e=>{if(e.key==='Enter')create()});
 const create=async()=>{const meta={id:uid(),name:name.value.trim()||t('defaultName'),tpl,paper,created:Date.now(),updated:Date.now(),thumb:''};await DB.put(meta,{id:meta.id,objs:[],view:null});$('#modalBack').hidden=true;openBoard(meta.id)};
 body.append(lbl('nameLbl'),name,lbl('paper'),tpls,lbl('paperColor'),paperRow);
 modal(t('newTitle'),body,[[t('cancel'),'ghost'],[t('create'),'primary',async()=>{await create();return false}]])}
function renameModal(m){const inp=document.createElement('input');inp.className='field';inp.id='rnName';inp.value=m.name;inp.setAttribute('aria-label',t('nameLbl'));
 modal(t('renameTitle'),inp,[[t('cancel'),'ghost'],[t('save'),'primary',async()=>{m.name=inp.value.trim()||m.name;await DB.put(m);renderLibrary()}]])}
async function gcAssets(){if(!DB.db||board)return;try{const metas=await DB.metas(),used=new Set();for(const m of metas){const d=await DB.data(m.id);for(const o of (d&&d.objs)||[]){if(o.asset)used.add(o.asset);if(o.pdf&&o.pdf.file)used.add(o.pdf.file)}}
 const recs=(await DB.tx('assets','readonly',t=>t.objectStore('assets').getAll()))||[],old=Date.now()-10*60*1000,dead=recs.filter(r=>!used.has(r.id)&&(r.created||0)<old).map(r=>r.id);
 if(dead.length&&!board)await DB.tx('assets','readwrite',t=>{const st=t.objectStore('assets');dead.forEach(k=>st.delete(k))})}catch(e){}}
function deleteModal(m){const p=document.createElement('p');p.style.margin='0';p.style.color='var(--muted)';p.textContent=t('deleteBody',{n:m.name});
 modal(t('deleteTitle'),p,[[t('cancel'),'ghost'],[t('delete'),'dangerbtn',async()=>{await DB.del(m.id);renderLibrary();gcAssets()}]])}
async function dupNotebook(m){const d=await DB.data(m.id);const meta={...m,id:uid(),name:m.name+' 2',updated:Date.now()};await DB.put(meta,{id:meta.id,objs:(d&&d.objs)||[],view:d&&d.view});renderLibrary()}
$('#importBtn').onclick=()=>$('#fileJson').click();
$('#fileJson').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;toast(t('preparing'),0);
 try{const j=JSON.parse(await f.text());if(j.format!=='daftar'||!Array.isArray(j.objs))throw 0;
  if(j.assets)for(const id in j.assets){const a=j.assets[id];if(!a||!a.blob)continue;await DB.putAsset({id,blob:dataURLToBlob(a.blob),small:a.small?dataURLToBlob(a.small):null})}
  const meta={...j.meta,id:uid(),updated:Date.now(),thumb:''};delete meta.view;meta.name=meta.name||t('defaultName');meta.tpl=meta.tpl||'blank';meta.paper=meta.paper||'white';
  for(const o of j.objs)if(o.asset)await ensureSmall(o.asset);meta.thumb=thumbFor(meta,j.objs);await DB.put(meta,{id:meta.id,objs:j.objs});await renderLibrary();toast(t('imported'))}catch(err){toast(t('importFail'))}});
/* ================= language & theme buttons ================= */
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 $$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$$('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));$$('[data-i18n-title]').forEach(e=>{e.title=t(e.dataset.i18nTitle);e.setAttribute('aria-label',e.title)});
 $('#langLbl').textContent=t('langName');renderLibrary();if(board){buildTray();if(!$('#menu').hidden)openMenu()}}
function toggleLang(){lang=lang==='ar'?'en':'ar';LS.set('lang',lang);applyLang()}
$('#langBtn').onclick=toggleLang;
$('#themeBtn').onclick=()=>{themePref=isDarkUI()?'light':'dark';LS.set('theme',themePref);applyTheme()};

/* ================= toast ================= */
let toastT=0;function toast(msg,ms=2400){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);if(ms)toastT=setTimeout(()=>el.hidden=true,ms)}
function hideToast(){$('#toast').hidden=true}

/* ================= sample notebook ================= */
function wave(x,y,len,amp,color,size,pen='ball'){const pts=[];for(let i=0;i<=60;i++){const tt=i/60;pts.push(x+tt*len,y+Math.sin(tt*Math.PI*3)*amp,.45+.25*Math.sin(tt*Math.PI))}return{id:uid(),t:'stroke',pen,color,size,pts}}
function sampleObjs(){const ar=lang==='ar';const F='IBM Plex Sans Arabic';const o=[];
 o.push({id:uid(),t:'text',x:ar?-40:0,y:0,w:560,text:ar?'الخلية النباتية':'The plant cell',font:'Reem Kufi',fs:46,fw:700,color:'#2a46c4'});
 o.push({id:uid(),t:'stroke',pen:'hl',color:'#ffe14d',size:22,pts:[ar?240:10,74,.5,ar?510:280,74,.5]});
 o.push({id:uid(),t:'text',x:ar?-40:0,y:100,w:560,text:ar?'تتميز عن الخلية الحيوانية بثلاثة أجزاء:\n١. الجدار الخلوي\n٢. البلاستيدات الخضراء\n٣. الفجوة العصارية الكبيرة':'Differs from an animal cell in three parts:\n1. Cell wall\n2. Chloroplasts\n3. A large central vacuole',font:F,fs:22,color:'#111111'});
 o.push({id:uid(),t:'shape',kind:'ellipse',x:ar?-420:620,y:40,w:300,h:210,color:'#2e7d32',size:3});
 o.push({id:uid(),t:'shape',kind:'ellipse',x:ar?-330:700,y:110,w:90,h:60,color:'#2e7d32',size:2});
 o.push({id:uid(),t:'shape',kind:'arrow',pts:ar?[-60,180,-200,150]:[560,180,700,150],color:'#c62828',size:3});
 o.push(wave(ar?-320:720,135,60,6,'#2e7d32',2.5,'fountain'));
 o.push({id:uid(),t:'text',x:ar?-40:0,y:330,w:560,text:ar?'تعريف البناء الضوئي:':'Photosynthesis is:',font:F,fs:22,fw:600,color:'#111111'});
 o.push({id:uid(),t:'text',x:ar?-40:0,y:372,w:560,text:ar?'عملية تصنع فيها النباتات غذاءها من الماء وثاني أكسيد الكربون باستخدام ضوء الشمس.':'The process plants use to make food from water and carbon dioxide using sunlight.',font:F,fs:20,color:'#111111'});
 o.push({id:uid(),t:'tape',x:ar?-50:-10,y:366,w:580,h:84,color:'#f0a35e',hidden:true});
 o.push({id:uid(),t:'text',x:ar?-420:620,y:320,w:260,text:ar?'مثال: اضغط على الشريط البرتقالي لكشف التعريف، واضغطه مرة ثانية لتغطيته.':'Example: tap the orange tape to reveal the definition, tap again to cover it.',font:F,fs:17,color:'#1d1f26',bg:'#fff1a6'});
 o.push(wave(ar?-40:0,470,300,4,'#111111',2.2,'ball'));
 return o}
async function seed(){if(LS.get('seeded',false))return;const metas=await DB.metas();if(metas.length){LS.set('seeded',true);return}
 const meta={id:uid(),name:lang==='ar'?'مثال: أحياء – الخلية':'Example: Biology – the cell',tpl:'lines',paper:'white',created:Date.now(),updated:Date.now(),thumb:''};
 const objs=sampleObjs();await DB.put(meta,{id:meta.id,objs,view:null});LS.set('seeded',true)}

/* ================= boot ================= */
if('serviceWorker' in navigator&&document.querySelector('link[rel="manifest"]')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
(async()=>{await DB.open();await seed();applyLang();setTimeout(gcAssets,5000);
 // refresh sample thumbnail once fonts are in
 document.fonts&&document.fonts.ready.then(async()=>{fontEpoch++;requestRender();const ms=await DB.metas();for(const m of ms)if(!m.thumb){const d=await DB.data(m.id);m.thumb=thumbFor(m,(d&&d.objs)||[]);await DB.put(m)}if(!board)renderLibrary()});
 if(document.fonts)document.fonts.onloadingdone=()=>{fontEpoch++;requestRender()};
 FONTS.forEach(f=>{try{document.fonts.load(`20px "${f}"`)}catch(e){}})})();
})();
</script>
